<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TracePoint - Kuveyt Türk</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="popup_style.css">
</head>

<body>
    <div class="ext-container">
        <header class="ext-header">
            <div class="logo">
                <img src="icons/icon.png" width="30" height="30" alt="logo" style="object-fit: contain;">
                <h2>TracePoint</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="themeToggleBtn" class="theme-toggle-btn" title="Koyu / Açık Mod" aria-label="Tema Değiştir">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <span class="badge" id="typeBadge">READY</span>
            </div>
        </header>

        <div class="search-target">
            <span class="target-label">Hedef</span>
            <span class="target-value" id="targetValue">Henüz Seçim Yok</span>
        </div>

        <main class="ext-content" id="extContent">
            <!-- Başlangıç State -->
            <div class="state-msg" id="msgEmpty">
                <div class="state-icon">🔍</div>
                Herhangi bir IP, Hash veya Domain seçip "Tara" butonuna basın.
            </div>

            <!-- Yükleniyor State -->
            <div class="state-msg" id="msgLoading" style="display: none;">
                <div class="spinner"></div>
                Tehdit İstihbarat Merkezleri Taranıyor...
            </div>

            <!-- Sonuç Listesi -->
            <div id="resultsWrapper" style="display: none;">
                <!-- AI Summary Accordion -->
                <div class="ai-box" id="aiBox">
                    <div class="ai-box-header" id="aiBoxHeader" role="button" tabindex="0" title="Özeti Aç / Kapat">
                        <h4>🧠 Yapay Zeka Özeti</h4>
                        <svg class="ai-box-chevron" id="aiBoxChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    <div class="ai-box-body" id="aiBoxBody">
                        <div id="aiSummaryBox" class="ai-summary-content">Hazırlanıyor...</div>
                    </div>
                </div>

                <!-- Verdict Pill Bar (v2) — JS tarafından doldurulur -->
                <div id="verdictBar" style="display:none;"></div>

                <!-- Sources Accordion (v2) — JS tarafından doldurulur -->
                <div id="sourcesAccordion" style="display:none;"></div>

                <!-- Rapor Tarama IOC Listesi (sadece report mode) -->
                <div class="sources-list" id="sourcesList" style="display:none;"></div>

                <!-- SPLUNK SIEM ENTEGRASYONU PANELİ -->
                <div class="splunk-panel" id="splunkPanel" style="display: none;">
                    <div class="splunk-panel-header" id="splunkPanelHeader" style="cursor: pointer; user-select: none;">
                        <span class="splunk-panel-title">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:6px;">
                                <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
                            </svg>
                            Splunk SPL Sorguları
                        </span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span class="splunk-loading-badge" id="splunkLoadingBadge" style="display:none;">
                                <div class="splunk-spinner"></div> Üretiliyor...
                            </span>
                            <span class="splunk-ready-badge" id="splunkReadyBadge" style="display:none;">✓ Hazır</span>
                            <svg class="splunk-accordion-chevron" id="splunkChevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div id="splunkQueriesList" style="display: none; padding: 10px;">
                        <!-- JS Injection: SPL sorgu kartları buraya eklenir -->
                    </div>
                </div>

            </div>
        </main>

        <footer class="ext-footer">
            <button id="refreshBtn" class="refresh-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Sonuçları Yenile
            </button>
            <button id="scanReportBtn" class="refresh-btn btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                Sayfa Raporunu Tara
            </button>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
